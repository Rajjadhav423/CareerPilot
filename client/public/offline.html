<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CareerPilot</title>
    <!-- Shown by the service worker (public/sw.js) when a page can't load without a network.
         Self-contained on purpose: no app CSS or JS is available offline. Colours match app/globals.css. -->
    <script>
      try {
        var p = localStorage.getItem("careerpilot-theme");
        var d = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      :root {
        --surface: #ffffff;
        --text: #292a2e;
        --text-subtle: #505258;
        --brand: #1868db;
        --inverse: #ffffff;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --surface: #1f1f21;
        --text: #cecfd2;
        --text-subtle: #a9abaf;
        --brand: #669df1;
        --inverse: #1f1f21;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--surface);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 56px; height: 56px; border-radius: 12px; }
      h1 { margin: 16px 0 4px; font-size: 20px; line-height: 28px; font-weight: 600; }
      p { margin: 0; color: var(--text-subtle); }
      button {
        margin-top: 20px;
        min-height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 4px;
        background: var(--brand);
        color: var(--inverse);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>CareerPilot needs an internet connection to load your jobs and emails. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload automatically as soon as the connection comes back
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>

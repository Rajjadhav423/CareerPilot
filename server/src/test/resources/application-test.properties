# Tests use a separate database so they never touch your real data.
# Same credentials as the app (from server/.env); override the URL with DB_TEST_URL if needed.
spring.datasource.url=${DB_TEST_URL:jdbc:postgresql://localhost:5432/careerpilot_test}

# Tests never call Clerk: they use Spring Security's jwt() test support or locally signed tokens.
careerpilot.clerk.issuer=https://test-instance.clerk.accounts.dev

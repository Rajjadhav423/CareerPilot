spring.application.name=careerpilot-server
server.port=${SERVER_PORT:8080}

# Local secrets (DB password, OAuth secrets) live in server/.env, which is git-ignored.
# Real environment variables override it, which is how production sets them.
spring.config.import=optional:file:.env[.properties]

# Database: PostgreSQL, schema managed only by Flyway (src/main/resources/db/migration)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Authentication: Clerk handles sign-up/sign-in; the API accepts Clerk session tokens (JWT, Bearer header).
# issuer = your Clerk "Frontend API URL", e.g. https://xxxx.clerk.accounts.dev (set CLERK_ISSUER in server/.env)
careerpilot.clerk.issuer=${CLERK_ISSUER}
# Origins allowed in the token's "azp" claim (the frontend URLs that may use these tokens)
careerpilot.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}
# Signing secret of the Clerk webhook endpoint (Clerk Dashboard -> Webhooks). Empty = webhooks disabled.
careerpilot.clerk.webhook-secret=${CLERK_WEBHOOK_SECRET:}
# Clerk secret key (server only): lets the backend fetch the user's Google token to send Gmail. Empty = Gmail disabled.
careerpilot.clerk.secret-key=${CLERK_SECRET_KEY:}

# PDF generation limits
careerpilot.documents.max-pages=10
careerpilot.documents.max-pdf-size=5MB
careerpilot.documents.render-timeout=20s
careerpilot.documents.max-concurrent=2
careerpilot.documents.max-queued=8
# Largest request body the API accepts
careerpilot.max-request-size=512KB

# Comma-separated list of frontend origins allowed to call /api/**
careerpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Outgoing HTTP calls (job board APIs)
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=20s
# Never follow redirects: outbound calls carry credentials and must only reach the intended host.
spring.http.clients.redirects=dont-follow

# Job discovery: public company job boards, as provider:slug:Company Name
# Providers: greenhouse (boards-api.greenhouse.io), lever (api.lever.co), ashby (api.ashbyhq.com)
careerpilot.discovery.cache-ttl=15m
careerpilot.discovery.boards=\
  greenhouse:groww:Groww,\
  greenhouse:druva:Druva,\
  greenhouse:hackerrank:HackerRank,\
  greenhouse:stripe:Stripe,\
  greenhouse:databricks:Databricks,\
  greenhouse:cloudflare:Cloudflare,\
  lever:cred:CRED,\
  lever:meesho:Meesho,\
  lever:zeta:Zeta,\
  lever:paytm:Paytm,\
  ashby:sarvam:Sarvam AI,\
  ashby:notion:Notion,\
  ashby:openai:OpenAI
